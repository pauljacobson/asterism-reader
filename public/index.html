<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <title>Asterism Reader</title>
    <meta name="theme-color" content="#14192b" />
    <meta name="apple-mobile-web-app-title" content="Asterism" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link
      rel="icon"
      href="/icons/favicon-16.png"
      type="image/png"
      sizes="16x16"
    />
    <link
      rel="icon"
      href="/icons/favicon-32.png"
      type="image/png"
      sizes="32x32"
    />
    <link
      rel="icon"
      href="/icons/asterism.svg"
      type="image/svg+xml"
      sizes="any"
    />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <span class="mark">⁂</span
        ><span class="brand-label"
          >Asterism<small>Your personal reader</small></span
        >
      </div>
      <nav aria-label="Main navigation"></nav>
      <div class="sidebar-bottom" hidden></div>
    </header>
    <div class="app-toolbar" hidden>
      <form id="quick-search-form" class="quick-search" role="search">
        <label class="sr-only" for="quick-search"
          >Search posts, people, or tags</label
        >
        <input
          id="quick-search"
          type="search"
          placeholder="Search posts, people, #tags…"
          maxlength="200"
          required
        />
        <button type="submit" aria-label="Search feed">↗</button>
      </form>
      <div class="top-tools" hidden>
        <button
          class="icon-button"
          data-page="preferences"
          aria-label="Preferences"
        >
          Aa</button
        ><button
          id="account-shortcut"
          class="icon-button"
          data-page="account"
          aria-label="Account"
        >
          ⁂
        </button>
      </div>
      <button
        class="button primary toolbar-follow"
        data-do="follow"
        aria-label="Follow someone"
      >
        ＋ <span>Follow someone</span>
      </button>
    </div>
    <div class="app-notices">
      <p id="offline-notice" class="notice" role="status" hidden>
        You’re offline. Reconnect to load posts and send actions.
      </p>
      <div id="update-notice" class="notice update-notice" role="status" hidden>
        <span>A new version of Asterism is ready.</span
        ><button class="button" data-do="update-app">Update app</button>
      </div>
    </div>
    <div id="status-message" role="status"></div>
    <main id="main" tabindex="-1"><p>Opening your reader…</p></main>
    <nav class="mobile-nav" aria-label="Mobile navigation" hidden></nav>
    <dialog id="modal" aria-labelledby="modal-title">
      <div class="dialog-top">
        <button class="reader-back" data-do="close-reader" hidden>
          ← Back to feed
        </button>
        <h2 id="modal-title" tabindex="-1"></h2>
        <div class="dialog-tools">
          <button
            class="icon-button reader-preferences"
            data-do="reader-settings"
            aria-label="Reading preferences"
            aria-expanded="false"
            aria-controls="reader-settings"
            hidden
          >
            Aa</button
          ><button class="dialog-close" aria-label="Close dialog">×</button>
        </div>
      </div>
      <div id="reader-settings" hidden>
        <label
          >Font<select id="reader-font">
            <option value="sans">Sans serif</option>
            <option value="serif">Serif</option>
          </select></label
        >
        <label
          >Text size <output id="reader-size-value">18 px</output
          ><input id="reader-size" type="range" min="16" max="26" value="18"
        /></label>
        <label
          >Theme<select id="reader-theme">
            <option value="light">Light</option>
            <option value="dark">Dark</option>
            <option value="system">System</option>
          </select></label
        >
      </div>
      <div class="dialog-body"></div>
    </dialog>
    <div class="toast" role="status" hidden></div>
  </body>
</html>
