let passkeys=['Personal passkey'];
let prefs={theme:'system',font:'sans',size:18};
try {const p=JSON.parse(localStorage.getItem('asterism-mosaic-preferences')||'null');if(p){if(['light','dark','system'].includes(p.theme))prefs.theme=p.theme;if(['serif','sans'].includes(p.font))prefs.font=p.font;if(p.size>=16&&p.size<=26)prefs.size=p.size}}catch{}
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ico=k=>icons[k]||icons.grid;
const button=(label,action,extra='',kind='')=>`<button class="button ${kind}" data-do="${action}" ${extra}>${label}</button>`;
const media=matchMedia('(prefers-color-scheme: dark)');
function applyPrefs(){document.body.dataset.theme=prefs.theme==='system'?(media.matches?'dark':'light'):prefs.theme;document.body.style.setProperty('--reading',prefs.font==='serif'?'Georgia,"Times New Roman",serif':'ui-sans-serif,system-ui,sans-serif');document.body.style.setProperty('--size',prefs.size+'px');try{localStorage.setItem('asterism-mosaic-preferences',JSON.stringify(prefs))}catch{}}
media.addEventListener('change',applyPrefs);applyPrefs();
function toast(s){$('.toast').textContent=s;$('.toast').hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('.toast').hidden=true,3500)}
function author(p){return `<div class="author"><span class="avatar">${esc(p.initials)}</span><div class="author-info"><strong>${esc(p.name)}</strong><span class="handle">${esc(p.handle)}</span></div>${p.time?`<time>${esc(p.time)}</time>`:''}</div>`}
function tags(p){return `<div class="tags">${p.tags.map(t=>`<button class="tag" data-tag="${esc(t)}">#${esc(t)}</button>`).join('')}</div>`}
function actions(p){return `<div class="actions"><button data-do="like" data-id="${p.id}" aria-label="Like post by ${p.name}" aria-pressed="${liked.has(p.id)}">${ico('heart')} ${p.likes+(liked.has(p.id)?1:0)}</button><button data-do="read" data-id="${p.id}" aria-label="Reply to ${p.name}">${ico('reply')} ${p.replies}</button><button data-do="save" data-id="${p.id}" aria-label="Save post by ${p.name}" aria-pressed="${saved.has(p.id)}">${ico('save')} ${saved.has(p.id)?'Saved':'Save'}</button></div>`}
function card(p){return `<article class="post" data-id="${p.id}">${author(p)}<div class="post-copy"><h2><button data-do="read" data-id="${p.id}">${esc(p.title)}</button></h2><p>${esc(p.body)}</p></div>${p.art?`<button class="art-button" data-do="read" data-id="${p.id}" aria-label="Open ${esc(p.title)}">${p.art}</button>`:''}${tags(p)}${actions(p)}</article>`}
function heading(k,t,s,action=''){return `<div class="page-heading"><div><div class="kicker">${k}</div><h1 tabindex="-1">${t}</h1><p class="subtitle">${s}</p></div>${action}</div>`}
function nav(){const items=[['feed','home','Feed'],['search','search','Search'],['people','people','People'],['lists','grid','Lists']];$('.top nav').innerHTML=items.map(([id,icon,name])=>`<button class="nav-button" data-page="${id}" ${page===id?'aria-current="page"':''}>${ico(icon)}${name}</button>`).join('');$('.mobile-nav').innerHTML=[...items,['more','sun','More']].map(([id,icon,name])=>`<button data-page="${id}" ${page===id||(id==='more'&&['account','preferences'].includes(page))?'aria-current="page"':''}>${ico(icon)}${name}</button>`).join('')}
function feed(){const visible=posts.filter(p=>feedFilter==='All'||(feedFilter==='Saved'?saved.has(p.id):p.type===feedFilter));return heading('Your daily constellation','Follow your curiosity.','A few familiar voices. Something you didn’t expect.',button(`${ico('people')} Follow someone`,'follow'))+`<div class="tool-row"><div class="chips">${['All','Notes','Photos','Long reads','Saved'].map(x=>`<button class="chip" data-filter="${x}" aria-pressed="${feedFilter===x}">${x}</button>`).join('')}</div><span class="muted">5 sample posts · newest first</span></div><div class="board">${visible.map((p,i)=>card(p)+(i===1&&feedFilter==='All'?'<div class="note"><span class="mark">⁂</span><div class="kicker">Room to explore</div><h2>People, not an algorithm.</h2><p>A quieter place for your corner of the web.</p><button class="text-button" data-page="search">Find a thought worth returning to →</button></div>':'')).join('')}</div>${visible.length?'':'<div class="empty">No saved posts yet. Use the bookmark on a post to keep it here.</div>'}<div class="end">You’ve reached the end of this little constellation.</div>`}
function searchView(){return heading('Find your way back','Search your world.','Posts, familiar people, and the threads that connect them.')+`<label class="search-field">${ico('search')}<input id="search-input" type="search" placeholder="Search words, people, or #hashtags" aria-label="Search posts, people, or hashtags" value="${esc(term)}"></label><div class="tool-row"><div class="chips">${['All','Posts','People','Hashtags'].map(x=>`<button class="chip" data-search-type="${x}" aria-pressed="${searchType===x}">${x}</button>`).join('')}</div><span class="muted">Sample history only · People searches your follows</span></div><div id="search-results"></div>`}
function results(){const needle=term.trim().toLocaleLowerCase(),tagQuery=needle.startsWith('#'),t=needle.replace(/^#/,'');const ps=posts.filter(p=>t&&(tagQuery?p.tags.some(x=>x.toLowerCase()===t):[p.title,p.body,p.extra].join(' ').toLowerCase().includes(t)));const persons=people.filter(p=>p.following&&t&&`${p.name} ${p.handle}`.toLowerCase().includes(t));const ts=[...new Set(posts.flatMap(p=>p.tags))].filter(x=>t&&x.toLowerCase().includes(t));let out='';if(!t){out='<div class="note"><div class="kicker">Try a little discovery</div><h2>What stayed with you?</h2><p>Try “living room”, Maya, or a hashtag below. Search includes the full sample post, even text hidden from the feed card.</p><div class="tags">'+['SmallWeb','Books','SlowLiving'].map(x=>`<button class="tag" data-tag="${x}">#${x}</button>`).join('')+'</div></div>'}else{if(['All','Posts'].includes(searchType))out+=ps.map(p=>`<article class="result">${author(p)}<h2><button data-do="read" data-id="${p.id}">${esc(p.title)}</button></h2><p>${esc([p.body,p.extra].join(' '))}</p>${tags(p)}</article>`).join('');if(['All','People'].includes(searchType))out+=persons.map(p=>`<div class="result">${person(p)}</div>`).join('');if(['All','Hashtags'].includes(searchType))out+=ts.map(t=>`<div class="result"><button class="tag" data-tag="${t}">#${t}</button><p>${posts.filter(p=>p.tags.includes(t)).length} sample posts</p></div>`).join('');if(!out)out='<div class="empty">No matches in this sample history. Try another word or hashtag.</div>'}$('#search-results').innerHTML=`<div class="result-list">${out}</div>`}
function person(p){return `<div class="person-row">${author({...p,time:''})}<div class="flex-wrap">${p.following?'<span class="badge">Following</span>':p.pending?'<span class="badge">Request pending</span>':button('Follow','follow-person',`data-id="${p.id}"`)}${p.following?button('Lists','assign',`data-id="${p.id}"`):''}</div></div>`}
function peopleView(){return heading('Your orbit','People you follow.','These sample follows represent your connected WordPress account.',button(`${ico('people')} Follow someone`,'follow'))+`<div class="panel"><span class="muted">${people.filter(p=>p.following).length} following · ${people.filter(p=>p.pending).length} pending</span>${people.filter(p=>p.following||p.pending).map(person).join('')}</div>`}
function listsView(){return heading('A little organization','Your lists.','Keep familiar voices together. People can belong to more than one list.',button('Create a list','create-list'))+`<p class="notice">Future feature preview · these are sample lists. Importing your Mastodon export is tracked for later.</p><div class="result-list">${lists.map((l,i)=>`<div class="result list-card"><div><h3>${esc(l.name)}</h3><p>${l.members.length} people</p></div>${button('View list','view-list',`data-index="${i}"`)}</div>`).join('')}</div>`}
function preferences(){return heading('Make yourself comfortable','Preferences.','A reader that feels at home, wherever you are.')+`<div class="settings-layout"><div><section class="panel"><h2>Appearance</h2><p>Choose a mood, or let your device decide.</p><div class="control-label">Theme</div><div class="theme-choice">${['light','dark','system'].map(t=>`<button data-theme-choice="${t}" aria-pressed="${prefs.theme===t}"><span class="theme-swatch ${t}"></span>${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div></section><section class="panel"><h2>Reading</h2><label class="control-label" for="font-choice">Font family</label><select id="font-choice"><option value="sans" ${prefs.font==='sans'?'selected':''}>Sans serif — clean and familiar</option><option value="serif" ${prefs.font==='serif'?'selected':''}>Serif — a little more bookish</option></select><label class="control-label" for="text-size">Text size <span id="size-value">${prefs.size} px</span></label><input id="text-size" type="range" min="16" max="26" value="${prefs.size}"><p>Your changes apply immediately.</p></section><p class="muted">This preview remembers preferences in this browser. The finished app will save them to your account.</p></div><section class="panel"><div class="kicker">A live reading sample</div><div class="sample-reading"><h3>A little space for wonder.</h3><p>The best corners of the web still feel like someone invited you into their living room.</p><p>Stories, small discoveries, and a thoughtful conversation. At your own pace.</p></div><div class="tags"><span class="tag">#SmallWeb</span></div></section></div>`}
function account(){return heading('Your place in the constellation','Account.','Manage how you sign in and how Asterism connects to your site.')+`<div class="settings-layout"><div><section class="panel"><h2>Passkeys</h2><p>Use your device or password manager to sign in.</p>${passkeys.map((p,i)=>`<div class="setting-row"><div><h3>${esc(p)}</h3><span class="muted">Sample credential · no real passkey created</span></div>${button('Remove','remove-key',`data-index="${i}" ${passkeys.length===1?'disabled':''}`)}</div>`).join('')}${button('Add a passkey','add-key')}<p class="muted">Keep at least one passkey.</p></section><section class="panel"><h2>Backup codes</h2><p>${backupConfirmed?'6 unused sample codes · saving confirmed':'Save recovery codes so you have another way back in.'}</p>${button(backupConfirmed?'Replace backup codes':'Set up backup codes','codes')}<p class="muted">Single-use codes. Replacement invalidates the old set.</p></section><section class="panel"><h2>Sessions</h2><div class="setting-row"><div><h3>This browser</h3><p>Current preview session</p></div><span class="badge">Current</span></div>${spareSession?`<div class="setting-row"><div><h3>Safari on iPhone</h3><p>Illustrative session</p></div>${button('Sign out','revoke-session')}</div>`:'<p>No other sample sessions.</p>'}</section></div><div><section class="panel"><div class="avatar">SR</div><h2 style="margin-top:16px">Sample Reader</h2><p>Personal reader · demo account</p>${button('Preview account setup','setup')}</section><section class="panel"><h2>WordPress connection</h2><p>wordpress.example.com</p><div class="setting-row"><span><i class="status-dot"></i>${connected?'Connected · simulated':'Disconnected · simulated'}</span></div><p>Follows, replies, and reactions use your WordPress identity.</p>${button(connected?'Disconnect':'Reconnect','connection')}<p class="muted">No authorization token is present in this preview.</p></section></div></div>`}
function render(){nav();$('#main').innerHTML=({feed,search:searchView,people:peopleView,lists:listsView,preferences,account}[page]||feed)();if(page==='search')results()}
function go(p){if(p==='more'){modal('Your reader',`<div class="stack">${button('Account','go-account')}${button('Preferences','go-preferences')}${button('Saved posts','go-saved')}</div>`);return}page=p;render();window.scrollTo(0,0);$('#main h1')?.focus({preventScroll:true})}
function modal(title,html){if(!$('#modal').open){backFocus=document.activeElement;$('#modal').showModal();document.body.style.overflow='hidden'}$('#modal-title').textContent=title;$('.dialog-body').innerHTML=html;$('.dialog-close').focus()}
function close(){if($('#reply-text'))drafts.set($('#reply-text').dataset.id,$('#reply-text').value);$('#modal').close();document.body.style.overflow='';if(backFocus?.isConnected)backFocus.focus()}
$('.dialog-close').onclick=close;$('#modal').addEventListener('cancel',e=>{e.preventDefault();close()});
function read(id){const p=posts.find(x=>x.id===id);modal(p.title,`${author(p)}<div class="post-copy"><p>${esc(p.body)}</p>${p.extra.split('\n\n').map(x=>`<p>${esc(x)}</p>`).join('')}</div>${p.art}${tags(p)}${actions(p)}<hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><h3>Add to the conversation</h3><p class="muted">Reply draft · nothing will be sent</p><label class="control-label" for="reply-text">Your reply</label><textarea id="reply-text" data-id="${p.id}" placeholder="A thought, a question, a little connection…">${esc(drafts.get(id)||'')}</textarea><div class="dialog-footer">${button('Save demo draft','draft','','primary')}</div>`)}
function follow(){modal('Follow someone',`<p>Find a person by their Fediverse handle or profile URL.</p><p class="notice">Sample directory only. Try Alex Rivera (public) or Sam Chen (approval required). No requests reach WordPress.</p><form id="follow-form"><label class="control-label" for="follow-query">Handle or profile URL</label><input id="follow-query" type="text" placeholder="@alex@photography.example" required autocomplete="off"><div class="dialog-footer"><button class="button primary" type="submit">Find person</button></div></form><div id="follow-result"></div><div class="dialog-footer">${button('Try Alex','example-person','data-id="alex"')}${button('Try Sam','example-person','data-id="sam"')}</div>`)}
function found(p){$('#follow-result').innerHTML=p?`<div class="result">${author(p)}<p class="muted">Following as Reader on wordpress.example.com · simulated</p>${p.locked?'<p class="muted">This person approves follow requests.</p>':''}${p.following?'<span class="badge">Already following</span>':p.pending?'<span class="badge">Request pending</span>':button(p.locked?'Request to follow':'Follow on WordPress','follow-person',`data-id="${p.id}"`,'primary')}</div>`:'<p class="form-error" role="status">No match in this sample directory. Try one of the example people below.</p>'}
function codes(setup=false){modal(setup?'2 of 3 · Save your backup codes':'Save your backup codes',`<p>Keep these somewhere safe, such as your password manager. Each code can be used once.</p><p class="notice">DEMONSTRATION ONLY — these are not valid recovery codes. A real replacement will require fresh passkey verification.</p><div class="codes">${Array.from({length:6},(_,i)=>`<span>DEMO-${i+1}000-NOTVALID</span>`).join('')}</div><div class="flex-wrap">${button('Copy sample codes','copy-codes')}${button('Download sample codes','download-codes')}</div><label class="check-label"><input type="checkbox" id="codes-saved"><span>I have saved my backup codes somewhere safe.</span></label><div class="dialog-footer">${button(setup?'Complete demo setup':'Confirm saved','confirm-codes',`disabled data-setup="${setup}"`,'primary')}</div><p class="muted">${backupConfirmed?'Your previous set remains active until you confirm the replacement.':'Saving confirmation is required to complete setup.'}</p>`)}
function setup(){modal('1 of 3 · Create your passkey',`<p>A calmer corner of the web, with a secure way in.</p><div class="note"><h2>Welcome to Asterism.</h2><p>Use your device or password manager to create a passkey, then save your backup codes.</p></div><p class="notice">This walkthrough simulates enrollment. It does not request biometrics or create credentials.</p><div class="dialog-footer">${button('Simulate passkey creation','setup-next','','primary')}</div>`)}
function assignment(id){const p=people.find(p=>p.id===id);modal('Lists for '+p.name,`<p class="notice">Future feature · changes last only in this preview.</p><form id="assign-form" data-id="${id}">${lists.map((l,i)=>`<label class="check-label"><input type="checkbox" name="list" value="${i}" ${l.members.includes(id)?'checked':''}>${esc(l.name)}</label>`).join('')}<div class="dialog-footer"><button class="button primary" type="submit">Save selections</button></div></form>`)}
// Delegate interactions so every route and modal uses the same sample state.
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){go(b.dataset.page);return}if(b.dataset.tag){term='#'+b.dataset.tag;searchType='Posts';if($('#modal').open)close();go('search');return}if(b.dataset.filter){feedFilter=b.dataset.filter;render();return}if(b.dataset.searchType){searchType=b.dataset.searchType;render();return}if(b.dataset.themeChoice){prefs.theme=b.dataset.themeChoice;applyPrefs();$$('[data-theme-choice]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.themeChoice===prefs.theme)));return}const a=b.dataset.do,id=b.dataset.id;
if(a==='read')read(id);
if(a==='like'||a==='save'){const set=a==='like'?liked:saved;set.has(id)?set.delete(id):set.add(id);const p=posts.find(x=>x.id===id);$$(`[data-do="${a}"][data-id="${id}"]`).forEach(x=>{x.setAttribute('aria-pressed',String(set.has(id)));x.innerHTML=a==='like'?`${ico('heart')} ${p.likes+(liked.has(id)?1:0)}`:`${ico('save')} ${saved.has(id)?'Saved':'Save'}`});if(page==='feed'&&feedFilter==='Saved')render();toast('Updated in this preview only.')}
if(a==='draft'){drafts.set($('#reply-text').dataset.id,$('#reply-text').value);close();toast('Draft saved for this preview. Nothing sent.')}
if(a==='follow')follow();if(a==='example-person'){$('#follow-query').value=people.find(p=>p.id===id).handle;found(people.find(p=>p.id===id))}
if(a==='follow-person'){const p=people.find(p=>p.id===id);if(p.locked)p.pending=true;else p.following=true;close();go('people');toast(p.locked?'Sample follow request pending approval.':'Following in this preview. Your site is unchanged.')}
if(a==='setup')setup();if(a==='setup-next')codes(true);if(a==='codes')codes();
if(a==='confirm-codes'){if(!$('#codes-saved').checked)return;backupConfirmed=true;const isSetup=b.dataset.setup==='true';modal(isSetup?'3 of 3 · You’re ready':'Backup codes saved',`<div class="note"><span class="mark">⁂</span><h2>A little peace of mind.</h2><p>Saving confirmed for this preview. No real credentials or backup codes were created.</p></div>${button('Back to Account','go-account','','primary')}`)}
if(a==='copy-codes'){try{await navigator.clipboard.writeText('ASTERISM DEMO — NOT VALID RECOVERY CODES\n'+Array.from({length:6},(_,i)=>`DEMO-${i+1}000-NOTVALID`).join('\n'));toast('Sample codes copied. Confirm saving separately.')}catch{toast('Copy unavailable. Use Download sample codes.')}}
if(a==='download-codes'){const blob=new Blob(['ASTERISM DEMO — NOT VALID RECOVERY CODES\n'+Array.from({length:6},(_,i)=>`DEMO-${i+1}000-NOTVALID`).join('\n')],{type:'text/plain'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='asterism-demo-backup-codes.txt';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
if(a==='go-account'||a==='go-preferences'||a==='go-saved'){close();if(a==='go-saved')feedFilter='Saved';go(a==='go-account'?'account':a==='go-preferences'?'preferences':'feed')}
if(a==='add-key'){modal('Add a passkey',`<p class="notice">In the finished app, verify an existing passkey first, then create another. This adds a sample entry only.</p><form id="key-form"><label class="control-label" for="key-name">Passkey name</label><input id="key-name" type="text" maxlength="60" placeholder="My backup security key" required><div class="dialog-footer"><button class="button primary" type="submit">Add sample passkey</button></div></form>`)}
if(a==='remove-key'&&passkeys.length>1){passkeys.splice(Number(b.dataset.index),1);render();toast('Sample passkey removed.')}
if(a==='revoke-session'){spareSession=false;render();toast('Sample session signed out.')}
if(a==='connection'){connected=!connected;render();toast('Preview connection state changed. Your site is unchanged.')}
if(a==='assign')assignment(id);
if(a==='create-list')modal('Create a list',`<form id="list-form"><label class="control-label" for="list-name">List name</label><input id="list-name" type="text" maxlength="70" required><p class="muted">Sample list · not synced to WordPress</p><div class="dialog-footer"><button class="button primary" type="submit">Create sample list</button></div></form>`);
if(a==='view-list'){const l=lists[Number(b.dataset.index)],lp=posts.filter(p=>l.members.includes(p.id));modal(l.name,`<p class="muted">${l.members.length} members · ${lp.length} sample posts</p>${lp.length?lp.map(card).join(''):'<p>Add people from the People section to see their posts here.</p>'}`)}
});
document.addEventListener('input',e=>{if(e.target.id==='search-input'){term=e.target.value;results()}if(e.target.id==='text-size'){prefs.size=Number(e.target.value);applyPrefs();$('#size-value').textContent=prefs.size+' px'}});
document.addEventListener('change',e=>{if(e.target.id==='font-choice'){prefs.font=e.target.value;applyPrefs()}if(e.target.id==='codes-saved')$('[data-do=confirm-codes]').disabled=!e.target.checked});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='follow-form'){const query=$('#follow-query').value.trim().replace(/^@/,'').toLowerCase();found(people.find(p=>p.handle.toLowerCase()===query||query===`https://${p.handle.split('@')[1]}/@${p.handle.split('@')[0]}`))}if(e.target.id==='key-form'){const name=$('#key-name').value.trim();if(!name)return;passkeys.push(name);close();render();toast('Sample passkey added.')}if(e.target.id==='list-form'){const name=$('#list-name').value.trim();if(!name)return;if(lists.some(l=>l.name.toLowerCase()===name.toLowerCase())){toast('A list with that name already exists.');return}lists.push({name,members:[]});close();render()}if(e.target.id==='assign-form'){const id=e.target.dataset.id;lists.forEach((l,i)=>{l.members=l.members.filter(x=>x!==id);if(e.target.querySelector(`input[value="${i}"]`).checked)l.members.push(id)});close();render();toast('Sample list selections saved.')}});
render();
</script></body></html>
