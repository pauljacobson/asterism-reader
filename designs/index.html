<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Asterism Reader — Mosaic</title><style>*{box-sizing:border-box}body{margin:0;background:#e2e5e3;color:#233a34;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:#fff;border-bottom:1px solid #d4dad5;padding:16px 24px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}h1{font-size:16px;margin:0;font-weight:600}small{font-size:11px;color:#6c7872;display:block;margin-top:4px}nav{display:flex;gap:4px}button,a{font:inherit;color:inherit;cursor:pointer;border:0;background:transparent;padding:10px 13px;text-decoration:none;border-radius:6px;font-size:12px}button[aria-pressed=true]{background:#e8eee7;color:#245748;font-weight:600}button:focus-visible,a:focus-visible{outline:3px solid #bc764d;outline-offset:2px}.sizes{margin-left:auto}.description{padding:13px 24px;background:#f6f7f4;display:flex;align-items:center;gap:15px;justify-content:space-between;font-size:12px;color:#64726a;line-height:1.5}.description p{margin:0}.stage{padding:22px 16px;height:calc(100dvh - 150px);min-height:500px;display:flex;justify-content:center}iframe{border:0;background:white;width:100%;height:100%;box-shadow:0 8px 40px #243b3420;border-radius:7px;transition:max-width .25s}.sample-note{font-size:10px;letter-spacing:.6px;text-transform:uppercase}a{white-space:nowrap}@media(max-width:700px){header{padding:12px;gap:10px}h1{font-size:14px}.sizes{display:none}header nav{margin-left:auto}.description{padding:10px 14px}.description a{padding:4px}.sample-note{display:none}.stage{padding:0;height:calc(100dvh - 155px)}iframe{border-radius:0}header small{font-size:10px}}</style></head><body><header><div><h1>⁂ Asterism Reader</h1><small>Mosaic · selected design direction</small></div><nav aria-label="Design directions"><button data-concept="current" aria-pressed="false">01 Current</button><button data-concept="journal" aria-pressed="false">02 Journal</button><button data-concept="mosaic" aria-pressed="true">03 Mosaic</button></nav><nav class="sizes" aria-label="Preview size"><button data-size="100%" aria-pressed="true">Desktop</button><button data-size="820px" aria-pressed="false">Tablet</button><button data-size="390px" aria-pressed="false">Mobile</button></nav></header><div class="description"><p id="description">A visual collection. Browse a mosaic of voices, then open any post in a focused reading view.</p><span class="sample-note">Illustrative content · local interactions only</span><a id="open" href="mosaic.html" target="_blank" rel="noopener">Open full size ↗</a></div><div class="stage"><iframe title="Asterism Reader design preview" src="mosaic.html"></iframe></div><script>const descriptions={current:'A calm social feed. Familiar navigation, generous post cards, and room for conversation.',journal:'An editorial reader. Warm paper, expressive typography, and a slower, more focused rhythm.',mosaic:'A visual collection. Browse a mosaic of voices, then open any post in a focused reading view.'};document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.concept){document.querySelector('iframe').src=b.dataset.concept+'.html';document.querySelector('#description').textContent=descriptions[b.dataset.concept];document.querySelector('#open').href=b.dataset.concept+'.html';document.querySelectorAll('[data-concept]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}if(b.dataset.size){document.querySelector('iframe').style.maxWidth=b.dataset.size;document.querySelectorAll('[data-size]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}})</script></body></html>
